services:
  postgres:
    image: postgres:16
    container_name: suepercharge-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suepercharge
    ports:
      # Host 5433 → container 5432, so we don't collide with a local
      # Homebrew/Postgres.app install that already owns host 5432.
      - "5433:5432"
    volumes:
      - suepercharge-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  suepercharge-pg-data:
